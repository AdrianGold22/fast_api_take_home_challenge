version: '3'

services:

  postgres_db:
    image: postgres:16-alpine
    container_name: fastapi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adrian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678b}
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_datos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adrian} -d ${POSTGRES_DB:-mi_base_datos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    image: image-fastapi
    build: .
    container_name: fastapi-application
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_SERVER: postgres_db
    volumes:
      - ./:/app/app 

volumes:
  postgres_data: